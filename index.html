
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Ponto</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#f4f6f8;margin:0;padding:10px;}
.container{max-width:900px;margin:auto;}

.card{
  background:#fff;
  padding:14px;
  border-radius:10px;
  margin-bottom:12px;
}

input{width:100%;padding:12px;margin-top:6px;font-size:16px;}

.actions{display:flex;flex-direction:column;gap:10px;margin-top:10px;}

button{
  padding:14px;border:none;border-radius:10px;
  color:#fff;font-weight:bold;cursor:pointer;
}

.btn-entrada{background:#2c7be5;}
.btn-saida{background:#c0392b;}
.btn-pdf{background:#28a745;}
.btn-edit{background:#6c757d;}

table{width:100%;border-collapse:collapse;}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:center;}

.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
}
.hidden{display:none;}

.modal-box{
  background:#fff;padding:20px;border-radius:10px;width:300px;
}

.card p{
  display:flex;
  justify-content:space-between;
}
span{font-weight:bold;color:#2c7be5;}
</style>
</head>

<body>
<div class="container">

<h2>🕒 Controle de Ponto</h2>

<div class="card">
<input type="date" id="data">
<input type="time" id="hora">

<label>
<input type="checkbox" id="horaExtra"> Hora Extra
</label>

<div class="actions">
<button class="btn-entrada" onclick="entrada()">Entrada</button>
<button class="btn-saida" onclick="saida()">Saída</button>
<button class="btn-pdf" onclick="pdf()">PDF</button>
</div>
</div>

<div class="card">
<h3>📋 Registros (Mês Atual)</h3>
<table>
<thead>
<tr>
<th>Data</th><th>Entrada</th><th>Saída</th><th>Horas</th><th>Ações</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>

<div class="card">
<h3>📊 Resumo</h3>
<p>Total Trabalhado: <span id="total"></span></p>
<p>Banco (+): <span id="pos"></span></p>
<p>Banco (-): <span id="neg"></span></p>
<p>Horas Extras: <span id="extra"></span></p>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
<div class="modal-box">
<h3>Editar</h3>

<input type="hidden" id="eid">

<label>Entrada</label>
<input type="time" id="eentrada">

<label>Saída</label>
<input type="time" id="esaida">

<label>
<input type="checkbox" id="eextra"> Hora Extra
</label>

<div class="actions">
<button class="btn-entrada" onclick="salvarEdit()">Salvar</button>
<button class="btn-saida" onclick="modal.classList.add('hidden')">Cancelar</button>
</div>
</div>
</div>

<script>
const { jsPDF } = window.jspdf;
const JORNADA = 570;

/* STORAGE */
const get=()=>JSON.parse(localStorage.getItem("p"))||{};
const save=p=>localStorage.setItem("p",JSON.stringify(p));

const mesAtual=()=>new Date().toISOString().slice(0,7);

/* TEMPO */
function minutos(e,s){
 if(!e||!s)return 0;

 let [h1,m1]=e.split(":").map(Number);
 let [h2,m2]=s.split(":").map(Number);

 let i=h1*60+m1,f=h2*60+m2;

 if(f<i)f+=1440;

 return f-i;
}

const h=m=>`${Math.floor(m/60)}h ${m%60}min`;
const br=d=>d.split("-").reverse().join("/");

/* ENTRADA */
function entrada(){
 if(!data.value||!hora.value)return alert("Preencha");

 const p=get();
 p[data.value]=p[data.value]||[];

 if(p[data.value].some(r=>!r.s))
  return alert("Já existe entrada aberta");

 p[data.value].push({
  id:Date.now(),
  e:hora.value,
  s:"",
  t:horaExtra.checked?"extra":"normal"
 });

 horaExtra.checked=false;
 save(p);load();
}

/* SAÍDA */
function saida(){
 if(!data.value||!hora.value)return alert("Preencha");

 const p=get();
 if(!p[data.value]) return;

 const r=p[data.value].find(x=>!x.s);
 if(!r) return;

 r.s=hora.value;

 save(p);load();
}

/* EDITAR */
function edit(d,id){
 const r=get()[d].find(x=>x.id==id);

 eid.value=id;
 eid.dataset.data=d;

 eentrada.value=r.e;
 esaida.value=r.s;
 eextra.checked=r.t==="extra";

 modal.classList.remove("hidden");
}

function salvarEdit(){
 const p=get();
 const d=eid.dataset.data;

 const r=p[d].find(x=>x.id==eid.value);

 r.e=eentrada.value;
 r.s=esaida.value;
 r.t=eextra.checked?"extra":"normal";

 save(p);
 modal.classList.add("hidden");
 load();
}

/* LOAD + RESUMO */
function load(){
 tabela.innerHTML="";

 const p=get();
 const mes=mesAtual();

 let total=0;
 let pos=0;
 let neg=0;
 let extra=0;

 Object.keys(p).forEach(d=>{
  if(!d.startsWith(mes)) return;

  p[d].forEach(r=>{
   let m=minutos(r.e,r.s);

   total+=m;

   if(r.t==="extra"){
     extra+=m;
   }else{
     let saldo = m - JORNADA;

     if(saldo > 0){
       pos += saldo;
     }else if(saldo < 0){
       neg += Math.abs(saldo);
     }
   }

   tabela.innerHTML+=`
   <tr>
   <td>${br(d)}</td>
   <td>${r.e}</td>
   <td>${r.s||"-"}</td>
   <td>${r.s?h(m):"-"}</td>
   <td>
    <button class="btn-edit" onclick="edit('${d}','${r.id}')">✏️</button>
   </td>
   </tr>`;
  });
 });

 document.getElementById("total").innerText=h(total);
 document.getElementById("pos").innerText=h(pos);
 document.getElementById("neg").innerText=h(neg);
 document.getElementById("extra").innerText=h(extra);
}

/* PDF */
function pdf(){
 const doc=new jsPDF();
 let y=20;

 doc.text("Relatório Mensal",105,y,{align:"center"});
 y+=10;

 const p=get();
 const mes=mesAtual();

 Object.keys(p).forEach(d=>{
  if(!d.startsWith(mes)) return;

  doc.text(br(d),10,y); y+=6;

  p[d].forEach(r=>{
   const t=r.s?h(minutos(r.e,r.s)):"--";
   doc.text(`${r.e}-${r.s||"--"} ${t}`,10,y);
   y+=6;
  });
 });

 doc.save("ponto.pdf");
}

/* INIT */
(()=>{
 const n=new Date();
 data.value=n.toISOString().split("T")[0];
 hora.value=n.toTimeString().slice(0,5);
 load();
})();
</script>

</body>
</html>
